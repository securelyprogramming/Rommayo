name: Release apps
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: --linux AppImage --x64
            name: linux
          - os: windows-latest
            target: --win nsis --x64
            name: windows
          - os: macos-latest
            target: --mac dmg --arm64
            name: macos
          - os: macos-15-intel
            target: --mac dmg --x64
            name: macos-intel
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run dist -- ${{ matrix.target }}
      - name: Verify macOS bundle signature
        if: runner.os == 'macOS'
        run: for bundle in release/*/*.app; do codesign --verify --deep --strict "$bundle"; done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.name }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947
        with:
          cache-disabled: true
      - name: Restore release key
        env:
          ROMMAYO_KEYSTORE_BASE64: ${{ secrets.ROMMAYO_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          key = Path(os.environ['RUNNER_TEMP']) / 'rommayo-release.p12'
          key.write_bytes(base64.b64decode(os.environ['ROMMAYO_KEYSTORE_BASE64']))
          key.chmod(0o600)
          PY
      - name: Build signed APK
        working-directory: android
        env:
          ROMMAYO_KEYSTORE: ${{ runner.temp }}/rommayo-release.p12
          ROMMAYO_STORE_PASSWORD: ${{ secrets.ROMMAYO_STORE_PASSWORD }}
          ROMMAYO_KEY_ALIAS: ${{ secrets.ROMMAYO_KEY_ALIAS }}
          ROMMAYO_KEY_PASSWORD: ${{ secrets.ROMMAYO_KEY_PASSWORD }}
        run: ./gradlew assembleRelease lintRelease
      - run: cp android/app/build/outputs/apk/release/app-release.apk Rommayo-${GITHUB_REF_NAME}-android.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android
          path: Rommayo-*-android.apk
      - if: always()
        run: rm -f "$RUNNER_TEMP/rommayo-release.p12"
  publish:
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish public alpha
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tar -czf artifacts/Rommayo-0.2.7-steam-artwork.tar.gz -C assets/steam icon.png portrait.png landscape.png hero.png logo.png steam-artwork.py
          cd artifacts
          sha256sum * > SHA256SUMS.txt
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" ./* --repo "$GITHUB_REPOSITORY" --title "Rommayo $GITHUB_REF_NAME · Public Alpha" --prerelease --notes-file ../docs/release-notes.md
          fi
